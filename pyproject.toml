# Comfy Registry packaging (https://docs.comfy.org/registry/specifications).
# Releases: publish.yml runs on v* tag pushes; the /bump-version procedure
# bumps [project].version, tags, and pushes. Never hand-roll a release.

[project]
name = "comfyui-mrln-nodes"
description = "MRLN Nodes - a multi-domain collection of custom nodes for ComfyUI."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = ["Operating System :: OS Independent"]

[tool.setuptools.dynamic]
# Single source of truth for dependencies is requirements.txt (what ComfyUI
# Manager installs); the registry reads it through this dynamic mapping.
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/master-merlin/comfyui-mrln-nodes"
"Bug Tracker" = "https://github.com/master-merlin/comfyui-mrln-nodes/issues"

[tool.comfy]
PublisherId = "master-merlin"
DisplayName = "MRLN Nodes"
requires-comfyui = ">=0.3.0"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
# N802: ComfyUI's node API mandates UPPER_CASE method names (INPUT_TYPES,
#       IS_CHANGED, VALIDATE_INPUTS).
# N999: the repo/module dir is hyphenated (ComfyUI-MRLN-Nodes) per ComfyUI
#       custom-node convention; ComfyUI's loader handles it fine.
ignore = ["N802", "N999"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-export shims

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
